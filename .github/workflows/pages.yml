name: Deploy dashboard to GitHub Pages

on:
  schedule:
    - cron: "17 22 * * 1-5"
  push:
    branches: [main]
  workflow_dispatch:
  workflow_run:
    workflows: ["Refresh MCP Registry observation", "Refresh Cloudflare Radar observation"]
    types: [completed]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    environment:
      name: github-pages
    runs-on: ubuntu-latest
    env:
      FMP_API_KEY: ${{ secrets.FMP_API_KEY }}
      FMP_PUBLIC_DISPLAY_APPROVED: ${{ vars.FMP_PUBLIC_DISPLAY_APPROVED }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Create licensed FMP snapshot for this deployment
        id: fmp_snapshot
        if: env.FMP_API_KEY != '' && env.FMP_PUBLIC_DISPLAY_APPROVED == 'true'
        continue-on-error: true
        run: node scripts/ingest-fmp-market-data.mjs
      - name: Explain unavailable FMP endpoint access
        if: steps.fmp_snapshot.outcome == 'failure'
        run: echo "::warning::FMP snapshot omitted because the configured account did not return usable endpoint data. The rest of the dashboard will deploy normally."
      - name: Explain omitted FMP snapshot
        if: env.FMP_API_KEY == '' || env.FMP_PUBLIC_DISPLAY_APPROVED != 'true'
        run: echo "FMP snapshot omitted. Configure FMP_API_KEY and set FMP_PUBLIC_DISPLAY_APPROVED=true only after written public-display and retention rights are confirmed."
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Prepare public artifact
        run: |
          mkdir _site
          rsync -a \
            --exclude .git \
            --exclude .github \
            --exclude _site \
            --exclude companies \
            --exclude docs \
            --exclude scripts \
            --exclude data/raw \
            . _site/
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
