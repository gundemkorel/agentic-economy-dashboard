name: Refresh MCP Registry observation

on:
  schedule:
    - cron: "17 14 * * 1"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Fetch and normalize registry data
        run: node scripts/ingest-mcp-registry.mjs
      - name: Commit refreshed observation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/raw/mcp-registry data/processed/mcp-registry-history.json data/processed/mcp-registry-current.json
          git diff --cached --quiet || git commit -m "Refresh MCP Registry observation"
          git push
