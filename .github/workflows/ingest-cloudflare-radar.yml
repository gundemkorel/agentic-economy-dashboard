name: Refresh Cloudflare Radar observation

on:
  schedule:
    - cron: "31 14 * * 1"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: observation-ingestion
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_RADAR_API_TOKEN: ${{ secrets.CLOUDFLARE_RADAR_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Fetch and normalize AI bot traffic proxy
        if: env.CLOUDFLARE_RADAR_API_TOKEN != ''
        run: node scripts/ingest-cloudflare-radar.mjs
      - name: Refresh observation register
        if: env.CLOUDFLARE_RADAR_API_TOKEN != ''
        run: node scripts/build-observation-register.mjs
      - name: Explain skipped refresh
        if: env.CLOUDFLARE_RADAR_API_TOKEN == ''
        run: echo "Skipping Cloudflare Radar refresh because CLOUDFLARE_RADAR_API_TOKEN is not configured."
      - name: Commit refreshed observation
        if: env.CLOUDFLARE_RADAR_API_TOKEN != ''
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/raw/cloudflare-radar data/processed/cloudflare-ai-bot-current.json data/processed/cloudflare-ai-bot-history.json data/processed/observation-register.json
          git diff --cached --quiet || git commit -m "Refresh Cloudflare Radar observation"
          git push
